# ============================================================
#  BorderGuard · 全部提示文字
#  ------------------------------------------------------------
#  & 为颜色符：&8 深灰 &7 灰 &f 白 &a 绿 &e 黄 &c 红 &b 青 &3 深青
#  {0} {1} {2} ... 为占位符，顺序见每行的注释
#  改完执行 /border reload
# ============================================================

prefix: "&8[&3边界&8] &f"

# ---- 通用 ----
no-permission: "&c你没有权限使用该指令。"
player-only: "&c该操作只能由玩家在游戏内执行。"
unknown-command: "&c未知的子指令 &e{0}&c，输入 &f/border help&c 查看帮助。"
world-not-found: "&c找不到世界 &e{0}&c。"
need-world: "&c请指定世界名：&f/border info <世界>&c 或 &f/border list <世界>"
no-region: "&7世界 &e{0} &7还没有设置任何边界节点。"
reload-done: "&a配置与区域文件已重新载入 &8(&7{0} 个世界&8)"

# ---- 调试杖 ----
wand-given: "&a已获得 &b边界调试杖&a。&7右键加节点，左键撤销。"
wand-disabled: "&c调试杖已在 config.yml 中被禁用。"
wand-full: "&c背包已满，无法给予调试杖。"

# ---- 节点操作 ----
# {0}=序号 {1}=x {2}=y {3}=z {4}=当前数量 {5}=需要数量
node-added: "&a已添加节点 &e#{0} &8(&f{1}&7, &f{2}&7, &f{3}&8) &8| &7节点 &e{4}&8/&e{5}"
node-added-active: "&a已添加节点 &e#{0} &8| &a区域已生效 &8(&7{4} 个节点&8)"
node-duplicate: "&c该位置已有节点，换个地方吧。"
node-removed: "&a已删除节点 &e#{0}&a，剩余 &e{1} 个。"
# {0}=剩余数量
node-undone: "&e已撤销最后一个节点，剩余 &f{0} &e个。"
node-none-yet: "&7当前世界还没有任何节点。"
node-index-invalid: "&c节点序号无效，当前共 &e{0} &c个节点。"
cleared: "&a已清空当前世界 &e{0} &a个节点。"
already-clear: "&7当前世界本来就没有节点。"
# {0}=世界 {1}=数量 {2}=需要数量
node-list-header: "&8---- &7边界节点 &8· &b{0} &8· &e{1}&8/&e{2} &8----"
node-list-item: "  &8#&f{0} &8→ &7{1}&8, &f{2}&8, &7{3}"
node-list-footer: "&8-----------------------------"

# ---- 区域状态 ----
region-on: "&a当前世界的边界限制已 &l开启&a。"
region-off: "&e当前世界的边界限制已 &l关闭&e。"
# {0}=节点数 {1}=需要数
region-active: "&a区域 &l已生效&a &8(&7{0} 个节点，需要 {1} 个&8)"
region-inactive: "&e区域 &l未生效&e &8(&7{0} 个节点，需要 {1} 个&8)"
# {0}=世界 {1}=节点数 {2}=状态 {3}=Y模式 {4}=救援方式
info-line: "&8· &7世界 &f{0} &8| &7节点 &f{1} &8| &7状态 {2} &8| &7Y &f{3} &8| &7越界 &f{4}"
info-bounds: "&8· &7范围 &fX {0}~{1} &8, &7Z {2}~{3} &8, &7Y {4}"
info-spawn: "&8· &7救援点 &f{0}&8, &f{1}&8, &f{2}"

# ---- 参数设置 ----
min-set: "&a当前世界所需节点数已设为 &e{0}&a。"
min-invalid: "&c节点数至少为 &e3&c（多边形最少三个点）。"
usage-y: "&c用法：&f/border y <最低Y> <最高Y> &7或 &f/border y full"
y-set: "&a当前世界 Y 范围已设为 &e{0} &7~ &e{1}&a。"
y-full: "&a当前世界已取消 Y 轴限制（整根柱子都算界内）。"
y-invalid: "&cY 范围无效：最小值必须小于最大值。"
spawn-set: "&a已将救援点设在脚下 &8(&f{0}&7, &f{1}&7, &f{2}&8)"
spawn-none: "&7当前世界还没有设置救援点，使用 &f/border spawn&7 设置。"
bypass-on: "&e你已 &l无视&e 边界限制（调试用）。"
bypass-off: "&a你已 &l恢复&a 边界限制。"
tp-node: "&a已传送到节点 &e#{0}&a。"

# ---- 越界 ----
blocked: "&c一道无形的结界挡住了你的去路。"
pushed: "&c你已越出边界，正在被送回区域内。"
rescued: "&e你被结界送回，别再乱跑了。"

# ---- 调试渲染 ----
debug-on: "&a边界线预览已 &l开启&a，再输一次可关闭。"
debug-off: "&7边界线预览已关闭。"
debug-no-region: "&c当前世界还没有边界数据，先用 &f/border wand&c 去画。"

# ---- 帮助 ----
help:
  - "&8&m                                                  "
  - "&b&lBorderGuard &7· 玩家行动区域限制 &8v{0}"
  - ""
  - " &f/border wand &8- &7领取调试杖（右键加节点 / 左键撤销）"
  - " &f/border add &8- &7在脚下添加一个边界节点"
  - " &f/border undo &8- &7撤销最后一个节点"
  - " &f/border remove <序号> &8- &7删除指定节点"
  - " &f/border insert <序号> &8- &7把节点插到指定位置"
  - " &f/border list &8- &7查看所有节点"
  - " &f/border clear &8- &7清空当前世界节点"
  - " &f/border tp <序号> &8- &7传送到某个节点"
  - ""
  - " &f/border on|off &8- &7开启 / 关闭当前世界边界"
  - " &f/border min <数量> &8- &7设置生效所需节点数"
  - " &f/border y <下> <上> &8- &7限制高度范围"
  - " &f/border y full &8- &7取消高度限制"
  - " &f/border spawn &8- &7把救援点设在脚下"
  - ""
  - " &f/border toggle &8- &7开关边界线预览"
  - " &f/border bypass &8- &7临时无视边界（自己调试用）"
  - " &f/border info &8- &7查看当前世界边界信息"
  - " &f/border reload &8- &7重载配置与区域文件"
  - "&8&m                                                  "
